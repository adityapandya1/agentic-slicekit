# slicekit: the pull request gate and the state sync (REQ-3.11). Every action is pinned by SHA.
name: slicekit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slicekit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The default branch is present
        run: git rev-parse --verify --quiet refs/remotes/origin/main
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Use the repository's git hooks
        run: git config core.hooksPath .githooks
      - name: No runtime dependencies (REQ-5.3)
        run: |
          node -e "const d = require('./package.json').dependencies || {}; const n = Object.keys(d); if (n.length) { console.error('package.json has dependencies: ' + n.join(', ')); process.exit(1) }"
      - name: slicekit check
        run: node bin/slicekit.js check --ci
      - name: The workflow matches the generator
        run: node bin/slicekit.js workflow --check
      - name: Upload the graph
        if: always() && hashFiles('.slicekit/graph/graph.json') != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: slicekit-graph
          path: .slicekit/graph/graph.json

  cmd-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: test
        run: 'node --test "test/**/*.test.js"'

  ready-label:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    needs: [gate, cmd-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Ready label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICEKIT_CHECKS_OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: node bin/slicekit.js ready-label

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Use the repository's git hooks
        run: git config core.hooksPath .githooks
      - name: Sync state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/slicekit.js status --sync --write
      - name: Commit state
        env:
          ALLOW_PROTECTED_COMMIT: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BUILD.md .slicekit/state
          git diff --cached --quiet || { git commit -m 'chore(slicekit): sync state [skip ci]' && git push; }
