# slicekit: the pull request gate and the state sync (REQ-3.11). Every action is pinned by SHA.
name: slicekit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slicekit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.bookkeeping.outputs.kind }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The default branch is present
        run: git rev-parse --verify --quiet refs/remotes/origin/main
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Bookkeeping or code (D-49)
        id: bookkeeping
        env:
          GH_TOKEN: ${{ github.token }}
          SLICEKIT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SLICEKIT_PR_BASE_BRANCH: ${{ github.base_ref }}
        run: node node_modules/slicekit/bin/slicekit.js ci bookkeeping --head "$SLICEKIT_PR_HEAD" --base-branch "$SLICEKIT_PR_BASE_BRANCH" --output "$GITHUB_OUTPUT"
      - name: Use the repository's git hooks
        run: git config core.hooksPath .githooks
      - name: Build the graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: node node_modules/slicekit/bin/slicekit.js graph
      - name: slicekit check
        run: node node_modules/slicekit/bin/slicekit.js check --ci
      - name: The workflow matches the generator
        run: node node_modules/slicekit/bin/slicekit.js workflow --check
      - name: Upload the graph
        if: always() && hashFiles('.slicekit/graph/graph.json') != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: slicekit-graph
          path: .slicekit/graph/graph.json

  cmd-test:
    needs: [gate]
    if: ${{ !cancelled() && !(needs.gate.outputs.kind == 'bookkeeping') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: test
        run: 'node --test "test/**/*.test.js"'

  cmd-lint:
    needs: [gate]
    if: ${{ !cancelled() && !(needs.gate.outputs.kind == 'bookkeeping') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: lint
        run: npm run lint

  obs-1:
    name: 'Smoke: staging health'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: 'Smoke: staging health'
        env:
          STAGING_URL: 'https://staging.example.com'
        run: curl -fsS "$STAGING_URL/health"

  ready-label:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    needs: [gate, cmd-test, cmd-lint, obs-1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Ready label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICEKIT_CHECKS_OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.gate.result == 'success' && (needs.cmd-test.result == 'success' || (needs.cmd-test.result == 'skipped' && needs.gate.outputs.kind == 'bookkeeping')) && (needs.cmd-lint.result == 'success' || (needs.cmd-lint.result == 'skipped' && needs.gate.outputs.kind == 'bookkeeping')) && needs.obs-1.result == 'success' }}
        run: node node_modules/slicekit/bin/slicekit.js ready-label

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Use the repository's git hooks
        run: git config core.hooksPath .githooks
      - name: Sync state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node node_modules/slicekit/bin/slicekit.js status --sync --write
      - name: Commit state
        env:
          ALLOW_PROTECTED_COMMIT: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BUILD.md .slicekit/state
          git diff --cached --quiet || { git commit -m 'chore(slicekit): sync state [skip ci]' && git push; }
